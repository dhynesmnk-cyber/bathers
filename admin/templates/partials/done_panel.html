<div id="done-panel" class="help-panel" hidden aria-labelledby="done-heading">
  <div class="help-panel-header">
    <h2 id="done-heading" class="mono pane-heading">DONE</h2>
    <button id="done-close-btn" type="button" class="btn btn-plain">Close <span class="mono key-hint">Esc</span></button>
  </div>

  <section class="help-section">
    <p>Published venues — read-only. Edit an already-approved listing by hand-editing its MDX file and rebuilding.</p>
  </section>

  <section class="help-section">
    <p id="done-empty" class="mono empty-state" hidden></p>
    <ul id="done-list" class="help-shortcut-list mono"></ul>
  </section>
</div>
