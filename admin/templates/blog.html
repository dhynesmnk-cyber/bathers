<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where We Bathe — Blog</title>
    <link rel="stylesheet" href="/static/admin.css?v={{ static_version }}" />
    <link rel="stylesheet" href="/static/vendor/quill/quill.snow.css" />
    <link rel="stylesheet" href="/static/blog.css?v={{ static_version }}" />
  </head>
  <body>
    <header class="hub-header">
      <span class="mono eyebrow">WHERE WE BATHE — BLOG</span>
      <p id="save-status" class="mono save-status" aria-live="polite"></p>
      <span id="deploy-chip" class="mono deploy-chip" aria-live="polite"></span>
      <a href="/articles" class="btn btn-plain">Articles</a>
      <a href="/claims" class="btn btn-plain">Claims</a>
      <a href="/" class="btn btn-plain">Back to hub</a>
    </header>

    <main class="blog-grid">
      <section class="pane blog-list-pane" aria-labelledby="blog-list-heading">
        <h2 id="blog-list-heading" class="mono pane-heading">POSTS</h2>
        <form id="new-post-form" class="blog-new-form">
          <input id="new-post-title" class="mono text-input" type="text" placeholder="New post title…" required />
          <button type="submit" class="btn btn-thermal">New</button>
        </form>
        <ul id="blog-list" class="queue-list" role="listbox" aria-label="Blog posts"></ul>
        <p id="blog-list-empty" class="mono empty-state" hidden>No posts yet. Give one a title to begin.</p>
      </section>

      <section class="pane blog-editor-pane" aria-labelledby="blog-editor-heading">
        <h2 id="blog-editor-heading" class="mono pane-heading">EDITOR</h2>
        <div id="editor-empty" class="mono empty-state">Select a post, or start a new one.</div>
        <div id="editor-content" hidden>
          <label class="field">
            <span class="mono field-label">Title</span>
            <input id="field-title" class="text-input" type="text" data-field="title" />
          </label>

          <label class="field">
            <span class="mono field-label">Summary</span>
            <textarea id="field-summary" class="text-input" data-field="summary" rows="2" maxlength="160"></textarea>
          </label>

          <div class="field-row">
            <label class="field">
              <span class="mono field-label">Dateline</span>
              <input id="field-dateline" class="text-input mono" type="date" data-field="dateline" />
            </label>
            <label class="field">
              <span class="mono field-label">Video URL (YouTube/Vimeo)</span>
              <input id="field-video-url" class="text-input mono" type="url" data-field="video_url" placeholder="https://youtu.be/…" />
            </label>
          </div>

          <div class="field">
            <span class="mono field-label">Cover image</span>
            <div id="cover-image-preview" class="image-strip"></div>
            <input id="cover-image-input" type="file" accept="image/*" class="mono" />
          </div>

          <div class="field-row">
            <label class="field">
              <span class="mono field-label">Cover alt text</span>
              <input id="field-cover-alt" class="text-input" type="text" placeholder="describe the cover for screen readers" />
            </label>
            <label class="field cover-ai-field">
              <input id="field-cover-ai" type="checkbox" />
              <span class="mono field-label">AI-generated header (must be credited)</span>
            </label>
          </div>
          <div class="field-row">
            <label class="field">
              <span class="mono field-label">Cover credit</span>
              <input id="field-cover-credit" class="text-input" type="text" placeholder="e.g. Illustration generated with … / Photo: name" />
            </label>
            <label class="field">
              <span class="mono field-label">Cover source URL</span>
              <input id="field-cover-source" class="text-input mono" type="url" placeholder="https://…" />
            </label>
          </div>
          <label class="field">
            <span class="mono field-label">Cover licence URL</span>
            <input id="field-cover-license" class="text-input mono" type="url" placeholder="https://…" />
          </label>

          <div class="field">
            <span class="mono field-label">Body</span>
            <div id="quill-editor"></div>
          </div>

          <div class="blog-actions">
            <span id="status-chip" class="status-chip"></span>
            <button id="publish-btn" type="button" class="btn btn-thermal">Publish &amp; go live</button>
            <button id="delete-btn" type="button" class="btn btn-oxide">Delete</button>
            <button id="unpublish-btn" type="button" class="btn btn-oxide" hidden>Unpublish from live</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/vendor/quill/quill.js"></script>
    <script src="/static/blog.js?v={{ static_version }}"></script>
  </body>
</html>
