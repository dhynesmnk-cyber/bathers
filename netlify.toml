[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

# Gate 6 (SEO/AI-citation remediation, 2026-07-31): the Netlify default
# subdomain still resolves and served canonical/og tags on itself until
# today's custom-domain switch. Force every request there to the apex so no
# duplicate host stays crawlable or shareable.
[[redirects]]
  from = "https://bathers-directory.netlify.app/*"
  to = "https://wherewebathe.com/:splat"
  status = 301
  force = true

# Editorial Gate E1 (2026-08-01): comparison intents voiced as an article are
# canonical at /blog/ and the matching generated /compare/<query_key>/ page is
# suppressed (site/src/data/articles.ts). One 301 per migrated intent keeps the
# old, indexed /compare/ URL pointing at its article — one intent, one URL.
# Add a line here whenever an article claims a comparison query_key.
[[redirects]]
  from = "/compare/cheapest/"
  to = "/blog/cheapest-bathhouses-in-australia/"
  status = 301

[[redirects]]
  from = "/compare/contrast-therapy/"
  to = "/blog/contrast-therapy-in-australia/"
  status = 301

[[redirects]]
  from = "/compare/natural-thermal-springs/"
  to = "/blog/natural-thermal-springs-in-australia/"
  status = 301

# ---------------------------------------------------------------------------
# Geography moved under /places/ (2026-09-08 — TRD.md §1)
# ---------------------------------------------------------------------------
# The flat /<state-code>/ space could not survive a second country: AU's Western
# Australia and US's Washington are both "WA". Every old geographic URL 301s to
# its place in the new hierarchy so nothing indexed by Gates 6-11 is lost.
# Splats cover a state's index and its filter pages in one rule
# (/vic/ and /vic/magnesium-pool/ both match /vic/*).

