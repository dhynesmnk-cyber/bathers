[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

# Gate 6 (SEO/AI-citation remediation, 2026-07-31): the Netlify default
# subdomain still resolves and served canonical/og tags on itself until
# today's custom-domain switch. Force every request there to the apex so no
# duplicate host stays crawlable or shareable.
[[redirects]]
  from = "https://bathers-directory.netlify.app/*"
  to = "https://wherewebathe.com/:splat"
  status = 301
  force = true

# Editorial Gate E1 (2026-08-01): comparison intents voiced as an article are
# canonical at /blog/ and the matching generated /compare/<query_key>/ page is
# suppressed (site/src/data/articles.ts). One 301 per migrated intent keeps the
# old, indexed /compare/ URL pointing at its article — one intent, one URL.
# Add a line here whenever an article claims a comparison query_key.
[[redirects]]
  from = "/compare/cheapest/"
  to = "/blog/cheapest-bathhouses-in-australia/"
  status = 301

[[redirects]]
  from = "/compare/contrast-therapy/"
  to = "/blog/contrast-therapy-in-australia/"
  status = 301

[[redirects]]
  from = "/compare/natural-thermal-springs/"
  to = "/blog/natural-thermal-springs-in-australia/"
  status = 301

# Gate 12 (2026-09-08) — security headers. The public site is static with no
# runtime backend, so this is defence in depth rather than a fix for anything
# exploitable today. The CSP is written against what the site actually loads:
# its own assets, inline styles/scripts that Astro emits at build time, and
# GoatCounter for the Book-now click counter (TRD.md §8, 2026-07-20 exception),
# the claim form's cross-origin POST to the admin app (CLAIM_API_BASE_URL in
# site/src/config.ts), and the two video hosts blog embeds resolve to
# (youtube-nocookie / player.vimeo — site/src/config.ts's videoEmbedUrl never
# emits any other). There is no other third-party origin, so everything else
# is denied outright. Adding an origin to the site means adding it here too.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = """\
      default-src 'self'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'; \
      object-src 'none'; \
      img-src 'self' data: https://*.goatcounter.com; \
      font-src 'self'; \
      style-src 'self' 'unsafe-inline'; \
      script-src 'self' 'unsafe-inline' https://gc.zgo.at; \
      connect-src 'self' https://*.goatcounter.com https://bathers-admin.fly.dev; \
      frame-src https://www.youtube-nocookie.com https://player.vimeo.com"""
