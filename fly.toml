# fly.toml app configuration file generated for bathers-admin on 2026-07-21T08:49:25+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bathers-admin'
primary_region = 'syd'

[build]
[[mounts]]
  source = 'admin_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
